<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Star - Sagutan</title>
  <style>
    :root {
      --navy: #071b3b;
      --blue: #0d5db8;
      --gold: #ffd35a;
      --gold-dark: #9c6900;
      --green: #159447;
      --red: #b31414;
      --panel: rgba(255, 255, 255, 0.96);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 18px;
      color: #14213d;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #166ac7 0, transparent 48%),
        linear-gradient(135deg, #001333, #0d4e9d 55%, #001333);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }

    .page {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .panel {
      padding: clamp(18px, 4vw, 34px);
      border: 3px solid var(--gold);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 15px 40px rgba(0, 0, 0, .35);
    }

    .login-panel { margin-top: 10vh; text-align: center; }
    .login-panel h1 { margin-top: 0; color: var(--navy); }
    .login-panel input {
      width: 100%;
      margin: 14px 0;
      padding: 15px;
      border: 2px solid #8ba0bd;
      border-radius: 10px;
      text-align: center;
      font-size: 22px;
      letter-spacing: 4px;
    }

    .primary-button,
    .logout-button,
    .decision-button {
      min-height: 54px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .primary-button { width: 100%; background: var(--blue); }
    .logout-button { background: #5b6470; }
    .decision-button { flex: 1; font-size: clamp(18px, 4vw, 25px); }
    .deal-button { background: var(--green); }
    .no-deal-button { background: var(--red); }

    .error {
      min-height: 24px;
      color: var(--red);
      font-weight: 700;
    }

    .hidden { display: none !important; }

    .connection {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      color: #fff;
      background: #9b1c1c;
      text-align: center;
      font-weight: 700;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .game-header h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(24px, 6vw, 42px);
    }

    .star-name {
      margin: 6px 0 20px;
      color: var(--gold-dark);
      font-size: clamp(20px, 5vw, 32px);
      font-weight: 900;
      text-align: center;
    }

    .question-status {
      margin-bottom: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eaf2ff;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
    }

    .timer {
      display: grid;
      min-height: 72px;
      margin-bottom: 18px;
      place-items: center;
      border: 3px solid var(--gold-dark);
      border-radius: 16px;
      color: #5f3d00;
      background: #fff4c2;
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 900;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .answer-button {
      min-height: clamp(100px, 20vw, 150px);
      border: 4px solid #9ca9bb;
      border-radius: 16px;
      color: #102040;
      background: linear-gradient(145deg, #ffffff, #d9e4f3);
      font-size: clamp(34px, 10vw, 70px);
      font-weight: 900;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }

    .answer-button.selected {
      border-color: #e0a800;
      background: linear-gradient(145deg, #fff4a3, #ffd35a);
      box-shadow: 0 0 24px rgba(255, 211, 90, .95);
      transform: scale(1.03);
    }

    .answer-button.correct {
      border-color: #08762f;
      color: #fff;
      background: linear-gradient(145deg, #4bd875, #08762f);
    }

    .answer-button.wrong {
      border-color: #7f1010;
      color: #fff;
      background: linear-gradient(145deg, #ff7777, #a30d0d);
    }

    .decision-area {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .footer-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    @media (max-width: 430px) {
      body { padding: 10px; }
      .panel { border-width: 2px; border-radius: 16px; }
      .game-header { align-items: flex-start; flex-direction: column; }
      .logout-button { width: 100%; }
      .decision-area { flex-direction: column; }
    }
  
    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background: url('/images/logo.png') center / min(70vw, 680px) auto no-repeat;
      filter: blur(2px);
      opacity: .075;
    }
    .page { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <main class="page">
    <div id="connectionStatus" class="connection">Kumokonekta...</div>

    <section id="loginPanel" class="panel login-panel">
      <h1>Lucky Star</h1>
      <p>Ilagay ang password ng Lucky Star para magpatuloy.</p>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Ilagay ang password">
      <button id="loginButton" class="primary-button" type="button">MAG-LOGIN</button>
      <div id="loginError" class="error"></div>
    </section>

    <section id="gamePanel" class="panel hidden">
      <div class="game-header">
        <h1>Lucky Star</h1>
      </div>

      <div id="starName" class="star-name">Naghihintay sa pangalan mula sa roleta</div>
      <div id="questionStatus" class="question-status">Hintayin ang controller na magbukas ng briefcase.</div>
      <div id="timer" class="timer">--</div>

      <div id="answerGrid" class="answer-grid">
        <button class="answer-button" data-answer="A" type="button" disabled>A</button>
        <button class="answer-button" data-answer="B" type="button" disabled>B</button>
        <button class="answer-button" data-answer="C" type="button" disabled>C</button>
        <button class="answer-button" data-answer="D" type="button" disabled>D</button>
      </div>

      <div id="decisionArea" class="decision-area hidden">
        <button id="dealButton" class="decision-button deal-button" type="button">DEAL</button>
        <button id="noDealButton" class="decision-button no-deal-button" type="button">NO DEAL</button>
      </div>

      <div class="footer-area">
        <button id="footerLogoutButton" class="logout-button" type="button">MAG-LOGOUT</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const connectionStatus = document.getElementById("connectionStatus");
    const loginPanel = document.getElementById("loginPanel");
    const gamePanel = document.getElementById("gamePanel");
    const passwordInput = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");
    const starName = document.getElementById("starName");
    const questionStatus = document.getElementById("questionStatus");
    const timer = document.getElementById("timer");
    const decisionArea = document.getElementById("decisionArea");
    const dealButton = document.getElementById("dealButton");
    const noDealButton = document.getElementById("noDealButton");
    const answerButtons = [...document.querySelectorAll(".answer-button")];

    let isLoggedIn = false;
    let currentState = null;
    let timerInterval = null;

    function showGamePage() {
      loginPanel.classList.add("hidden");
      gamePanel.classList.remove("hidden");
    }

    function showLoginPage() {
      isLoggedIn = false;
      loginPanel.classList.remove("hidden");
      gamePanel.classList.add("hidden");
      passwordInput.value = "";
      passwordInput.focus();
    }

    socket.on("connect", () => {
      connectionStatus.textContent = "Nakakonekta";
      connectionStatus.style.background = "#168613";
      socket.emit("register-device", "luckystar");
    });

    socket.on("disconnect", () => {
      connectionStatus.textContent = "Walang koneksyon";
      connectionStatus.style.background = "#9b1c1c";
    });

    socket.on("force-logout", () => {
      alert("Na-log out ka ng controller bilang Lucky Star.");
      showLoginPage();
    });

    loginButton.addEventListener("click", () => {
      const password = passwordInput.value;
      if (!password) return;
      loginButton.disabled = true;
      loginError.textContent = "";
      socket.emit("luckystar-login-attempt", { password }, (response) => {
        loginButton.disabled = false;
        if (!response?.success) {
          loginError.textContent = response?.message || "Login failed.";
          return;
        }
        isLoggedIn = true;
        showGamePage();
        renderState(currentState);
      });
    });

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") loginButton.click();
    });

    function logout() {
      socket.emit("luckystar-logout");
      showLoginPage();
    }

    document.getElementById("footerLogoutButton").addEventListener("click", logout);

    answerButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (button.disabled || !isLoggedIn) return;
        socket.emit("luckystar-answer-select", button.dataset.answer, (response) => {
          if (response && !response.success) questionStatus.textContent = response.message;
        });
      });
    });

    dealButton.addEventListener("click", () => {
      socket.emit("lucky-star-decision", "deal", (response) => {
        if (response && !response.success) questionStatus.textContent = response.message;
      });
    });

    noDealButton.addEventListener("click", () => {
      socket.emit("lucky-star-decision", "no_deal", (response) => {
        if (response && !response.success) questionStatus.textContent = response.message;
      });
    });

    socket.on("game-state", (state) => {
      currentState = state;
      if (isLoggedIn) renderState(state);
    });

    function renderState(state) {
      if (!state) return;
      const lucky = state.luckyStar || {};
      const active = state.activeBriefcase || {};
      const question = state.currentQuestion;
      const banker = state.banker || {};
      const hasQuestion = Boolean(
        active.caseNumber &&
        question &&
        state.currentPage === "briefcase" &&
        (active.choicesVisible || active.dealRevealMode || active.controllerOnlyMode)
      );
      const answerLocked = Boolean(lucky.answerLocked || lucky.answerJudged);
      const canAnswer =
        isLoggedIn && hasQuestion && !answerLocked &&
        !active.dealRevealMode && !active.controllerOnlyMode;

      starName.textContent = lucky.name || "Naghihintay ng pangalan mula sa roleta";

      if (state.currentPage === "briefcase" && active.caseNumber && !active.choicesVisible && !active.dealRevealMode) {
        questionStatus.textContent = "Hintayin ang Host na ipakita ang choices at simulan ang timer.";
      } else if (!hasQuestion) {
        questionStatus.textContent = state.currentPage === "game_end"
          ? "Tapos na ang laro."
          : "Hintayin ang Host na magbukas ng briefcase.";
      } else if (active.dealRevealMode || active.controllerOnlyMode) {
        questionStatus.textContent = "Hintayin ang Host.";
      } else if (lucky.answerJudged === "correct") {
        questionStatus.textContent = "Tama ang iyong sagot.";
      } else if (lucky.answerJudged === "wrong") {
        questionStatus.textContent = "Mali ang iyong sagot. Maghintay para sa paliwanag";
      } else if (lucky.answerLocked) {
        questionStatus.textContent = lucky.selectedAnswer
          ? `Naka-lock ang sagot: ${lucky.selectedAnswer}. Hintayin ang Host.`
          : "Ubos na ang oras. Hintayin ang Host.";
      } else {
        questionStatus.textContent = "Pumili ng sagot bago matapos ang oras.";
      }

      answerButtons.forEach((button) => {
        const selected = lucky.selectedAnswer === button.dataset.answer;
        const isCorrect = lucky.answerJudged !== null && question?.correctAnswer === button.dataset.answer;
        const isWrong = lucky.answerJudged === "wrong" && selected;
        button.disabled = !canAnswer;
        button.classList.toggle("selected", selected);
        button.classList.toggle("correct", isCorrect);
        button.classList.toggle("wrong", isWrong);
      });

      const decisionOpen = Boolean(banker.decisionOpen && banker.revealedRound === banker.computedForRound);
      decisionArea.classList.toggle("hidden", !decisionOpen);
      dealButton.disabled = !decisionOpen || Boolean(banker.lastDecision);
      noDealButton.disabled = !decisionOpen || Boolean(banker.lastDecision);

      if (active.dealRevealMode || active.controllerOnlyMode) {
        stopTimer();
        timer.textContent = "--";
      } else if (lucky.answerDeadline && !lucky.answerLocked && !lucky.answerJudged) {
        startTimer(lucky.answerDeadline);
      } else {
        stopTimer();
        timer.textContent = lucky.answerLocked || lucky.answerJudged ? "NAKA-LOCK" : "--";
      }
    }

    function startTimer(deadline) {
      stopTimer();
      const update = () => {
        const remaining = Math.max(0, deadline - Date.now());
        timer.textContent = `${Math.ceil(remaining / 1000)}s`;
        if (remaining <= 0) stopTimer();
      };
      update();
      timerInterval = setInterval(update, 100);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
    }
  </script>
</body>
</html>
